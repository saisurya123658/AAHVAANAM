<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login | Aahvaanam</title>
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="admin-logo">A</div>
    <p class="eyebrow">AAHVAANAM</p>
    <h1>Admin Login</h1>
    <p class="muted">Manage booking requests and lodge records.</p>
    <form id="loginForm">
      <label>Email<input id="email" type="email" autocomplete="username" required /></label>
      <label>Password<input id="password" type="password" autocomplete="current-password" required /></label>
      <button class="btn" type="submit">Sign in</button>
      <p id="error" class="error"></p>
    </form>
    <a class="back" href="/">← Back to website</a>
  </main>
  <script>
    const form = document.querySelector("#loginForm");
    const error = document.querySelector("#error");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      error.textContent = "";
      const response = await fetch("/api/admin/login", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({
          email: document.querySelector("#email").value,
          password: document.querySelector("#password").value
        })
      });
      const data = await response.json();
      if (!response.ok) {
        error.textContent = data.error || "Login failed.";
        return;
      }
      location.href = "/admin/";
    });
  </script>
</body>
</html>
